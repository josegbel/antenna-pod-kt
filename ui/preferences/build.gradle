plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ktlint)
    alias(libs.plugins.kotlin.compose)
}
apply from: "../../common.gradle"
apply from: "../../playFlavor.gradle"

android {
    namespace "de.danoeh.antennapod.ui.preferences"

    buildFeatures {
        compose true
    }

    defaultConfig {
        def commit = ""
        try {
            def hashStdOut = new ByteArrayOutputStream()
            exec {
                commandLine "git", "rev-parse", "--short", "HEAD"
                standardOutput = hashStdOut
            }
            commit = hashStdOut.toString().trim()
        } catch (Exception ignore) {
        }
        buildConfigField "String", "COMMIT_HASH", ('"' + (commit.isEmpty() ? "Unknown commit" : commit) + '"')
    }
}

dependencies {
    implementation project(":event")
    implementation project(":net:common")
    implementation project(":net:sync:gpoddernet")
    implementation project(":storage:preferences")
    implementation project(":storage:importexport")
    implementation project(':system')
    implementation project(":ui:common")
    implementation project(":ui:i18n")
    implementation project(':net:sync:service-interface')
    implementation project(':net:sync:service')

    annotationProcessor libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.fragment
    implementation libs.google.material
    implementation libs.androidx.preference
    implementation libs.androidx.work.runtime
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling

    implementation libs.rxandroid
    implementation libs.rxjava
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.okhttp.urlconnection
    implementation libs.eventbus
    implementation libs.preferencesearch

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    // Deviation from Plan D4, disclosed in Implementation Notes: RecordingSynchronizationQueue
    // (D6) must override SynchronizationQueue.enqueueEpisodePlayed(FeedMedia?, Boolean), and
    // :model is only ever an `implementation` dependency repo-wide (verified: never `api`), so
    // it is not on this module's test compile classpath transitively via :net:sync:service-interface.
    testImplementation project(':model')
}
